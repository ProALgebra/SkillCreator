name: Bug report
description: Report a reproducible problem with Skill Curator.
title: '[Bug]: '
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OpenCode and plugin versions, your operating system, and the runtime used.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest workflow that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, private conversation content, and other sensitive data.
