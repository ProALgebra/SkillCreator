name: Feature request
description: Suggest an improvement to Skill Curator.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow or problem
      description: Describe what you are trying to accomplish and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
